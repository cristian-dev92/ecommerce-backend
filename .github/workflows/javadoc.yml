name: Generar y Desplegar Javadoc

on:
  push:
    branches: [ main, master ] # Se ejecuta cuando subes cambios a main o master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generar Javadoc con Maven
        run: mvn javadoc:javadoc -Dadditionalparam="-encoding UTF-8 -docencoding UTF-8 -charset UTF-8"

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Javadoc
        uses: actions/upload-pages-artifact@v3
        with:
          # Maven por defecto guarda el Javadoc generado en esta ruta:
          path: 'target/site/apidocs'

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: 'Helvetica', sans-serif; color: #1e293b; padding: 20px; }
        .header { margin-bottom: 30px; border-bottom: 2px solid #3b82f6; padding-bottom: 15px; }
        .title { font-size: 24px; font-weight: bold; color: #0f172a; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #f1f5f9; padding: 10px; text-align: left; font-size: 14px; }
        td { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
        .total-box { text-align: right; margin-top: 20px; font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <div class="title">DEVSHOP - FACTURA OFICIAL</div>
    <p><strong>Número de Pedido:</strong> <span th:text="${order.number}">PED-XXXX</span></p>
    <p><strong>Fecha:</strong> <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">01/01/2026</span></p>
    <p><strong>Cliente:</strong> <span th:text="${user.name}">Cristian</span> (<span th:text="${user.email}">user@email.com</span>)</p>
</div>

<table>
    <thead>
    <tr>
        <th>Producto</th>
        <th>Cantidad</th>
        <th>Precio Unitario</th>
        <th>Subtotal</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${order.items}">
        <td th:text="${item.productName}">Procesador Intel i7</td>
        <td th:text="${item.quantity}">1</td>
        <td th:text="${item.price} + ' €'">300 €</td>
        <td th:text="${item.subtotal} + ' €'">300 €</td>
    </tr>
    </tbody>
</table>

<div class="total-box">
    Total Pagado (IVA Incluido): <span th:text="${order.total} + ' €'">0.00 €</span>
</div>

</body>
</html>

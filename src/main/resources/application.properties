spring.application.name=ecommerce

## Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://ep-lucky-wind-algplu1k-pooler.c-3.eu-central-1.aws.neon.tech/ecommerce_db?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_lvoH5Z4BLiNU
spring.datasource.driver-class-name=org.postgresql.Driver

## Propiedades de JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.shutdown=immediate
spring.profiles.include=dev

# Configuración de ficheros de texto para i18n
spring.messages.basename=lang/res
spring.messages.encoding=UTF-8
spring.batch.jdbc.initialize-schema=never
spring.batch.job.enabled=false
spring.batch.job.name=importProductJobV3

## Configuración de Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Ajustes optimizados para el ciclo de vida de Neon (Free Tier)
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10

# Forzar a Hikari a probar la conexión antes de dársela a tu código
spring.datasource.hikari.connection-test-query=SELECT 1
